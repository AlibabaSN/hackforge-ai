version: '3.8'

services:
  hackforge-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hackforge-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hackforge_user:hackforge_pass@postgres:5432/hackforge_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - VLLM_BASE_URL=http://vllm:8000/v1
      - ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hackforge-net
    restart: always

  hackforge-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hackforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - hackforge-backend
    networks:
      - hackforge-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: hackforge-postgres
    environment:
      POSTGRES_USER: hackforge_user
      POSTGRES_PASSWORD: hackforge_pass
      POSTGRES_DB: hackforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackforge_user -d hackforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hackforge-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hackforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hackforge-net
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: hackforge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - hackforge-net
    restart: always

volumes:
  postgres-data:
  redis-data:
  ollama-data:

networks:
  hackforge-net:
    driver: bridge
