apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: hackforge-system
  labels:
    app: hackforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackforge-frontend
  template:
    metadata:
      labels:
        app: hackforge-frontend
    spec:
      containers:
        - name: frontend
          image: hackforge/frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://hackforge.ai/api"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: hackforge-system
spec:
  type: LoadBalancer
  selector:
    app: hackforge-frontend
  ports:
    - port: 80
      targetPort: 3000
