apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: hackforge-system
  labels:
    app: hackforge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackforge-backend
  template:
    metadata:
      labels:
        app: hackforge-backend
    spec:
      containers:
        - name: backend
          image: hackforge/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hackforge-config
          env:
            - name: DATABASE_URL
              value: "postgresql://hackforge_admin:production_secure_pass_2026@postgres-service:5432/hackforge_production_db"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hackforge-system
spec:
  type: ClusterIP
  selector:
    app: hackforge-backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: hackforge-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
