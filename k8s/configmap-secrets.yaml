apiVersion: v1
kind: ConfigMap
metadata:
  name: hackforge-config
  namespace: hackforge-system
data:
  APP_ENV: "production"
  PORT: "8000"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  VLLM_BASE_URL: "http://vllm-service:8000/v1"
  ALLOWED_ORIGINS: "https://hackforge.ai,http://localhost:3000"

---
apiVersion: v1
kind: Secret
metadata:
  name: hackforge-secrets
  namespace: hackforge-system
type: Opaque
stringData:
  POSTGRES_USER: "hackforge_admin"
  POSTGRES_PASSWORD: "production_secure_pass_2026"
  JWT_SECRET: "hackforge_production_jwt_super_secret_key_2026"
